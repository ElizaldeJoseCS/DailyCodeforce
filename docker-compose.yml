services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailycodeforce
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dcf_dev_password}
      POSTGRES_DB: dailycodeforce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dailycodeforce:${DB_PASSWORD:-dcf_dev_password}@postgres:5432/dailycodeforce?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET:-changeme}
      JUDGE_URL: http://judge:8080
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - postgres
      - judge
    networks:
      - internal

  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 128
    tmpfs:
      - /tmp:size=64M,noexec
      - /work:size=256M,exec
    networks:
      - internal

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dailycodeforce
      DB_PASSWORD: ${DB_PASSWORD:-dcf_dev_password}
      DB_NAME: dailycodeforce
      GUILD_ID: ${GUILD_ID}
      NOTIFICATION_CHANNEL_ID: ${NOTIFICATION_CHANNEL_ID}
    depends_on:
      - postgres
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs:ro
      - uploads:/usr/share/nginx/html/uploads
    depends_on:
      - web
    networks:
      - internal

  cron:
    build:
      context: ./web
      dockerfile: Dockerfile.cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dailycodeforce:${DB_PASSWORD:-dcf_dev_password}@postgres:5432/dailycodeforce?schema=public
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JUDGE_URL: http://judge:8080
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      - postgres
      - judge
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: false

volumes:
  pgdata:
  uploads:
