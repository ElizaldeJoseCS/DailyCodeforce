services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailycodeforce
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dcf_dev_password}
      POSTGRES_DB: dailycodeforce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dailycodeforce:${DB_PASSWORD:-dcf_dev_password}@postgres:5432/dailycodeforce?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET:-changeme}
    volumes:
      - ./web/public/visuals:/app/public/visuals:ro
    depends_on:
      - postgres

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dailycodeforce
      DB_PASSWORD: ${DB_PASSWORD:-dcf_dev_password}
      DB_NAME: dailycodeforce
      GUILD_ID: ${GUILD_ID}
      NOTIFICATION_CHANNEL_ID: ${NOTIFICATION_CHANNEL_ID}
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web/public/visuals:/app/public/visuals:ro
    depends_on:
      - web

volumes:
  pgdata:
